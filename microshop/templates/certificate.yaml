apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigned-issuer
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: microshop-tls
spec:
  secretName: microshop-tls-secret
  issuerRef:
    name: selfsigned-issuer
  dnsNames:
    - "microshop.local"