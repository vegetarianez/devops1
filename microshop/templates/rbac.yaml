apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: microshop-role
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: microshop-rolebinding
subjects:
  - kind: ServiceAccount
    name: microshop-sa
roleRef:
  kind: Role
  name: microshop-role
  apiGroup: rbac.authorization.k8s.io