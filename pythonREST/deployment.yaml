apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: vegetarianez/hello-k8s:v2
          ports:
            - containerPort: 5001
          env:
            - name: NAME
              valueFrom:
                configMapKeyRef:
                  name: hello-config
                  key: NAME
            - name: DB_HOST
              value: "postgres-service"
            - name: DB_NAME
              value: "hello_db"
            - name: DB_USER
              value: "postgres"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD