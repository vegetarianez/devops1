apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      labels:
        app: hello
    spec:
      containers:
        - name: hello
          image: vegetarianez/hello-k8s:latest
          ports:
            - containerPort: 5001
          env:
            - name: NAME
              valueFrom:
                configMapKeyRef:
                  name: hello-config
                  key: NAME